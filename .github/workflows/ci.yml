name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: cross-compile
        shell: bash
        run: |
          # Build into RUNNER_TEMP rather than /dev/null, which Windows lacks.
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o "$RUNNER_TEMP/termchat-${target%/*}-${target#*/}" ./cmd/termchat
          done

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck install.sh

  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error -EnableExit

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      # Install from the snapshot the way users do (piped into iex), once in
      # PowerShell 7 and once in Windows PowerShell 5.1.
      - name: install (pwsh)
        shell: pwsh
        run: |
          $env:TERMCHAT_VERSION = (Get-Content dist/metadata.json -Raw | ConvertFrom-Json).version
          $env:TERMCHAT_BASE_URL = ([Uri](Resolve-Path dist).Path).AbsoluteUri
          $env:TERMCHAT_INSTALL_DIR = "$env:RUNNER_TEMP\tc-pwsh"
          Get-Content install.ps1 -Raw | Invoke-Expression
          & "$env:TERMCHAT_INSTALL_DIR\termchat.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "termchat --version failed" }

      - name: install (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:TERMCHAT_VERSION = (Get-Content dist/metadata.json -Raw | ConvertFrom-Json).version
          $env:TERMCHAT_BASE_URL = ([Uri](Resolve-Path dist).Path).AbsoluteUri
          $env:TERMCHAT_INSTALL_DIR = "$env:RUNNER_TEMP\tc-ps5"
          Get-Content install.ps1 -Raw | Invoke-Expression
          & "$env:TERMCHAT_INSTALL_DIR\termchat.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "termchat --version failed" }

      - name: a bad checksum aborts the install
        shell: pwsh
        run: |
          $bad = "$env:RUNNER_TEMP\bad-dist"
          Copy-Item dist $bad -Recurse
          (Get-Content "$bad/checksums.txt") -replace '^[0-9a-f]{64}', ('0' * 64) | Set-Content "$bad/checksums.txt"
          $env:TERMCHAT_VERSION = (Get-Content dist/metadata.json -Raw | ConvertFrom-Json).version
          $env:TERMCHAT_BASE_URL = ([Uri]$bad).AbsoluteUri
          $env:TERMCHAT_INSTALL_DIR = "$env:RUNNER_TEMP\tc-bad"
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { Write-Host "failed as expected: $_" }
          if (Test-Path "$env:TERMCHAT_INSTALL_DIR\termchat.exe") { throw "installed despite a bad checksum" }
